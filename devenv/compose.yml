name: easybox-dev

services:
  dev:
    build:
      context: ..
      dockerfile: devenv/Dockerfile
    image: easybox-dev:latest
    command: sleep infinity
    working_dir: /src
    volumes:
      - ..:/src
      # Linux-only artifacts stay in named volumes, off the Windows filesystem.
      - node_modules:/src/frontend/node_modules
      - go_mod:/go/pkg/mod
      - cache:/root/.cache
      - db:/etc/x-ui
      - logs:/var/log/x-ui
    ports:
      # Host 2000-2099 is often reserved by Windows (Hyper-V/WinNAT), so remap.
      - "12053:2053"   # panel
      - "12096:2096"   # subscription
      - "20000-20009:20000-20009/tcp"   # test inbounds (VLESS)
      - "20000-20009:20000-20009/udp"   # test inbounds (Hysteria2 / TUIC)

volumes:
  node_modules:
  go_mod:
  cache:
  db:
  logs:
